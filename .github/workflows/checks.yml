name: WetSoil checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pytest pytest-asyncio
      - run: python -m compileall -q custom_components tests
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check custom_components/wetsoil/frontend/wetsoil-card.js
      - run: node --test tests/frontend/*.test.cjs
  home-assistant-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install homeassistant==2026.11.0
      - run: python -c "import custom_components.wetsoil; import custom_components.wetsoil.config_flow; import custom_components.wetsoil.controller; import custom_components.wetsoil.weather; import custom_components.wetsoil.entity; import custom_components.wetsoil.sensor; import custom_components.wetsoil.switch; import custom_components.wetsoil.button; import custom_components.wetsoil.binary_sensor; import custom_components.wetsoil.number"
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
